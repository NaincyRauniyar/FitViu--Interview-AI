# ── Server ─────────────────────────────────────────────────────
server.port=8080

# ── Database: H2 in-memory by default; set SPRING_DATASOURCE_URL (+ USERNAME/PASSWORD) for Postgres
spring.datasource.url=jdbc:h2:mem:interviewdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=${H2_CONSOLE:false}
spring.h2.console.path=/h2-console

# ── JWT ────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ── AI Service (update ngrok URL each Colab session) ───────────
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}

# ── Mail: disabled in dev (set enabled=false to skip sending) ──
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.test-connection=false

# ── App ────────────────────────────────────────────────────────
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}
app.mail.from=${APP_MAIL_FROM:}

# ── Actuator ───────────────────────────────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mail.enabled=false

# ── Multipart ──────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── Logging ────────────────────────────────────────────────────
logging.level.com.interviewai=INFO
logging.level.org.springframework.security=WARN
