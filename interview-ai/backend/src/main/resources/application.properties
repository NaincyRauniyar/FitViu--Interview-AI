# ── Server ─────────────────────────────────────────────────────
server.port=8080

# ── Database: H2 in-memory for local dev ───────────────────────
spring.datasource.url=jdbc:h2:mem:interviewdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── JWT ────────────────────────────────────────────────────────
jwt.secret=dev-secret-key-change-in-production-min-32ch!
jwt.expiration=86400000

# ── AI Service (update ngrok URL each Colab session) ───────────
ai.service.url=http://localhost:8000

# ── Mail: disabled in dev (set enabled=false to skip sending) ──
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-gmail@gmail.com
spring.mail.password=your-16-char-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.test-connection=false

# ── App ────────────────────────────────────────────────────────
app.frontend.url=http://localhost:5173
app.mail.from=your-gmail@gmail.com

# ── Actuator ───────────────────────────────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ── Multipart ──────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── Logging ────────────────────────────────────────────────────
logging.level.com.interviewai=INFO
logging.level.org.springframework.security=WARN
